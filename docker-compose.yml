services:
  web:
    image: rocket-web-admin:development
    build:
      context: .
      target: development
    env_file:
      - .env
    ports:
      - '${PORT:?Set PORT in .env}:${PORT:?Set PORT in .env}'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command:
      [
        'sh',
        '-c',
        'pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0',
      ]

volumes:
  node_modules:
  next_cache:
